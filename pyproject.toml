[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "law-n-sql-playground"
version = "0.1.0"
description = "End-to-end Law-N playground: simulate network.routes and run N-SQL style queries."
authors = [
    { name = "Peace Thabiwa", email = "you@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "law-n-signal-sim>=0.1.0",
    # "law-n-sql-core>=0.1.0",  # optional; you can uncomment if published to PyPI
]

[project.optional-dependencies]
n-sql = [
    "law-n-sql-core>=0.1.0",
]

[project.scripts]
law-n-sql-playground = "law_n_sql_playground.cli:main"
